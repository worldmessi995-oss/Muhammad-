<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALZONE - Football Match Centre</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --live-color: #da3637;
            --btn-active: #238636;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #8b949e; margin-bottom: 20px; }
        .container { width: 100%; max-width: 600px; }
        
        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background-color: var(--btn-active);
            color: white;
            border-color: var(--btn-active);
        }
        
        .match-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .live-badge {
            color: #ffffff;
            background-color: var(--live-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        .time-badge {
            color: var(--accent-color);
            font-weight: 500;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
        }
        .team { flex: 1; text-align: center; color: #ffffff; }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            padding: 0 20px;
        }
        .vs {
            font-size: 16px;
            color: #8b949e;
            padding: 0 20px;
        }
        .status-msg {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <h1>GOALZONE</h1>
    <div class="subtitle">Football Match Centre</div>

    <div class="tabs">
        <button class="tab-btn active" id="live-tab" onclick="switchTab('live')">Live Scores</button>
        <button class="tab-btn" id="fixtures-tab" onclick="switchTab('fixtures')">Upcoming Fixtures</button>
    </div>

    <div class="container" id="match-list">
        <div class="status-msg">Loading matches...</div>
    </div>

    <script>
        let currentTab = 'live';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('live-tab').classList.toggle('active', tab === 'live');
            document.getElementById('fixtures-tab').classList.toggle('active', tab === 'fixtures');
            loadData();
        }

        async function loadData() {
            const container = document.getElementById('match-list');
            container.innerHTML = '<div class="status-msg">Updating...</div>';
            
            try {
                const endpoint = currentTab === 'live' ? '/api/live' : '/api/fixtures';
                const response = await fetch(endpoint);
                const data = await response.json();

                if (!response.ok || !data.response || data.response.length === 0) {
                    container.innerHTML = `<div class="status-msg">No ${currentTab} matches available at the moment.</div>`;
                    return;
                }

                container.innerHTML = '';

                data.response.slice(0, 50).forEach(match => { // പരമാവധി 50 മത്സരങ്ങൾ കാണിക്കുന്നു
                    const fixture = match.fixture;
                    const teams = match.teams;
                    const goals = match.goals;

                    const card = document.createElement('div');
                    card.className = 'match-card';

                    let statusHTML = '';
                    let middleHTML = '';

                    if (currentTab === 'live') {
                        statusHTML = `<span class="live-badge">${fixture.status.elapsed}'</span>`;
                        middleHTML = `<div class="score">${goals.home ?? 0} - ${goals.away ?? 0}</div>`;
                    } else {
                        const matchDate = new Date(fixture.date).toLocaleString('ml-IN', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
                        statusHTML = `<span class="time-badge">${fixture.status.short}</span>`;
                        middleHTML = `<div class="vs"><div>VS</div><div style="font-size:11px; margin-top:5px; color:#8b949e;">${matchDate}</div></div>`;
                    }

                    card.innerHTML = `
                        <div class="match-header">
                            <span>${match.league.name} (${match.league.country})</span>
                            ${statusHTML}
                        </div>
                        <div class="teams-container">
                            <div class="team">${teams.home.name}</div>
                            ${middleHTML}
                            <div class="team">${teams.away.name}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = '<div class="status-msg" style="color: #da3637;">Could not load data. Please check configuration.</div>';
            }
        }

        loadData();
        // ഓരോ 1 മിനിറ്റിലും ഓട്ടോമാറ്റിക് റിഫ്രഷ്
        setInterval(() => {
            if(currentTab === 'live') loadData();
        }, 60000);
    </script>
</body>
</html>
