<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALZONE - Live Football Scores</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --live-color: #da3637;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #8b949e; margin-bottom: 20px; }
        .container { width: 100%; max-width: 600px; }
        .match-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .live-badge {
            color: #ffffff;
            background-color: var(--live-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
        }
        .team { flex: 1; text-align: center; color: #ffffff; }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            padding: 0 20px;
        }
        .status-msg {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .refresh-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .refresh-btn:hover { background-color: #30363d; }
    </style>
</head>
<body>

    <h1>GOALZONE</h1>
    <div class="subtitle">Live Football Match Centre</div>

    <button class="refresh-btn" onclick="fetchLiveScores()">Refresh Scores</button>

    <div class="container" id="match-list">
        <div class="status-msg">Loading live matches...</div>
    </div>

    <script>
        async function fetchLiveScores() {
            const container = document.getElementById('match-list');
            container.innerHTML = '<div class="status-msg">Updating scores...</div>';
            
            try {
                // വെബ്സൈറ്റ് റൺ ചെയ്യുന്ന അതേ സെർവറിലെ API റൂട്ടിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു
                const response = await fetch('/api/live');
                const data = await response.json();

                if (!response.ok || !data.response || data.response.length === 0) {
                    container.innerHTML = '<div class="status-msg">No live matches available at the moment.</div>';
                    return;
                }

                container.innerHTML = ''; // പഴയ വിവരങ്ങൾ മാറ്റുന്നു

                data.response.forEach(match => {
                    const fixture = match.fixture;
                    const teams = match.teams;
                    const goals = match.goals;

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-header">
                            <span>${match.league.name} (${match.league.country})</span>
                            <span class="live-badge">${fixture.status.elapsed}'</span>
                        </div>
                        <div class="teams-container">
                            <div class="team">${teams.home.name}</div>
                            <div class="score">${goals.home ?? 0} - ${goals. Caring ?? 0}</div>
                            <div class="team">${teams.away.name}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="status-msg" style="color: #da3637;">Could not fetch live matches. Please check your API configuration or quota.</div>';
            }
        }

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ തനിയെ റൺ ആകാൻ
        fetchLiveScores();
        // ഓരോ 1 മിനിറ്റിലും സ്വയം അപ്ഡേറ്റ് ആകാൻ
        setInterval(fetchLiveScores, 60000);
    </script>
</body>
</html>
