<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALZONE - Live Football Centre</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151d30;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8fa0bc;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
        }
        .controls {
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #23314f;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .btn.active {
            background-color: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: bold;
        }
        .date-picker {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #23314f;
            padding: 8px 15px;
            border-radius: 20px;
            margin-left: 10px;
            outline: none;
        }
        .match-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 150px;
        }
        .status-message {
            color: var(--text-muted);
            font-size: 18px;
            padding: 20px;
        }
        .match-card {
            background: #1c263f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team { font-weight: 600; width: 40%; }
        .team.home { text-align: right; }
        .team.away { text-align: left; }
        .score {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            width: 20%;
        }
        .live-badge {
            background: #ff4a4a;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="header">GOALZONE</div>
    <div class="subtitle">The Football Live Centre - Live scores and upcoming fixtures</div>

    <div class="controls">
        <button id="btn-live" class="btn active" onclick="switchTab('live')">● Live</button>
        <button id="btn-upcoming" class="btn" onclick="switchTab('upcoming')">Upcoming / Results</button>
        <input type="date" id="match-date" class="date-picker" onchange="onDateChange()" style="display: none;">
    </div>

    <div class="match-container" id="match-centre">
        <div class="status-message" id="status-text">Connecting to server...</div>
        <div id="match-list"></div>
    </div>

    <script>
        // നിങ്ങളുടെ ശരിക്കുമുള്ള Render ബാക്കെൻഡ് URL ലിങ്ക് ഇവിടെ നൽകിയിരിക്കുന്നു
        const BACKEND_URL = 'https://muhammad-c5sn.onrender.com';
        let currentTab = 'live';

        // ഇന്ന് എത് ദിവസമാണെന്ന് ഇൻപുട്ടിൽ സെറ്റ് ചെയ്യാൻ
        document.getElementById('match-date').value = new Date().toISOString().split('T')[0];

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btn-live').classList.toggle('active', tab === 'live');
            document.getElementById('btn-upcoming').classList.toggle('active', tab === 'upcoming');
            document.getElementById('match-date').style.display = tab === 'upcoming' ? 'inline-block' : 'none';
            
            fetchData();
        }

        function onDateChange() {
            if (currentTab === 'upcoming') {
                fetchData();
            }
        }

        async function fetchData() {
            const statusText = document.getElementById('status-text');
            const matchList = document.getElementById('match-list');
            
            statusText.style.display = 'block';
            statusText.innerText = "Loading matches...";
            matchList.innerHTML = '';

            let url = `${BACKEND_URL}/api/live`;
            if (currentTab === 'upcoming') {
                const selectedDate = document.getElementById('match-date').value;
                url = `${BACKEND_URL}/api/fixtures?date=${selectedDate}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                statusText.style.display = 'none';

                if (!data.response || data.response.length === 0) {
                    matchList.innerHTML = `<div class="status-message">No matches found for this selection.</div>`;
                    return;
                }

                data.response.forEach(item => {
                    const fixture = item.fixture;
                    const teams = item.teams;
                    const goals = item.goals;

                    const homeScore = goals.home !== null ? goals.home : '-';
                    const awayScore = goals.away !== null ? goals.away : '-';

                    let liveBadgeHTML = '';
                    if (fixture.status.short !== 'NS' && fixture.status.short !== 'FT') {
                        liveBadgeHTML = `<div class="live-badge">${fixture.status.elapsed}'</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="team home">${teams.home.name}</div>
                        <div class="score">
                            ${liveBadgeHTML}
                            <div>${homeScore} - ${awayScore}</div>
                        </div>
                        <div class="team away">${teams.away.name}</div>
                    `;
                    matchList.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching data:", error);
                statusText.style.display = 'block';
                statusText.innerText = "Failed to connect to server. Please try again.";
            }
        }

        // ആദ്യ തവണ ലോഡ് ചെയ്യുമ്പോൾ റൺ ചെയ്യാൻ
        fetchData();
        // ലൈവ് സ്കോറുകൾക്കായി ഓരോ 30 സെക്കൻഡിലും ഓട്ടോമാറ്റിക് റിഫ്രഷ് ചെയ്യും
        setInterval(() => {
            if (currentTab === 'live') fetchData();
        }, 30000);
    </script>
</body>
</html>
