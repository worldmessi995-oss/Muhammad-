<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALZONE - Live Football</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #151c28;
            --accent: #00ff87;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #1e293b;
        }

        .header h1 {
            color: var(--accent);
            margin: 0;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.9em;
        }

        .controls {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid #2d3748;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn.active {
            background-color: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: bold;
        }

        .refresh-btn {
            background-color: transparent;
            color: var(--accent);
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .date-picker {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid #2d3748;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
        }

        .match-list {
            max-width: 800px;
            margin: 0 auto;
        }

        .match-card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 40%;
        }

        .team-info.away {
            justify-content: flex-end;
            text-align: right;
        }

        .team-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .team-name {
            font-weight: 500;
        }

        .score-info {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .status-badge {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #2d3748;
            color: var(--text-muted);
            margin-top: 5px;
            display: inline-block;
        }

        .status-badge.live {
            background-color: #e53e3e;
            color: white;
        }

        .watch-box {
            text-align: center;
            margin-top: 15px;
        }

        .watch-box a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .status-text {
            text-align: center;
            color: var(--text-muted);
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GOALZONE</h1>
        <p>THE FOOTBALL LIVE CENTRE</p>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="btn-all" class="btn active" onclick="filterMatches('all')">All</button>
            <button id="btn-live" class="btn" onclick="filterMatches('live')">Live</button>
            <button id="btn-finished" class="btn" onclick="filterMatches('finished')">Finished</button>
            <button id="btn-upcoming" class="btn" onclick="filterMatches('upcoming')">Upcoming</button>
        </div>
        <div>
            <input type="date" id="match-date" class="date-picker" onchange="fetchDataByDate()">
            <button class="refresh-btn" onclick="fetchData()">🔄 Refresh</button>
        </div>
    </div>

    <div class="watch-box">
        <p>✨ Live Streams: <a href="https://sports-track.link/new" target="_blank">SportsTrack</a></p>
    </div>

    <div id="match-list" class="match-list">
        <div class="status-text">Loading matches...</div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;
        let currentFilter = 'all';
        let matchesData = [];

        document.getElementById('match-date').valueAsDate = new Date();

        async function fetchData() {
            const statusDiv = document.getElementById('match-list');
            statusDiv.innerHTML = '<div class="status-text">Connecting to server...</div>';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/live`);
                const data = await response.json();
                
                if (data.error) {
                    statusDiv.innerHTML = `<div class="status-text">Error: ${JSON.stringify(data.error)}</div>`;
                    return;
                }
                
                matchesData = data;
                renderMatches();
            } catch (err) {
                statusDiv.innerHTML = '<div class="status-text">Failed to connect to server.</div>';
            }
        }

        async function fetchDataByDate() {
            const dateVal = document.getElementById('match-date').value;
            const statusDiv = document.getElementById('match-list');
            statusDiv.innerHTML = '<div class="status-text">Fetching matches for ' + dateVal + '...</div>';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/fixtures?date=${dateVal}`);
                const data = await response.json();
                
                if (data.error) {
                    statusDiv.innerHTML = `<div class="status-text">Error: ${JSON.stringify(data.error)}</div>`;
                    return;
                }
                
                matchesData = data;
                renderMatches();
            } catch (err) {
                statusDiv.innerHTML = '<div class="status-text">Failed to connect to server.</div>';
            }
        }

        function filterMatches(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn-group .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${filter}`).classList.add('active');
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('match-list');
            container.innerHTML = '';

            let filtered = matchesData.filter(item => {
                const status = item.fixture.status.short;
                if (currentFilter === 'live') return ['1H', 'HT', '2H', 'ET', 'P'].includes(status);
                if (currentFilter === 'finished') return ['FT', 'AET', 'PEN'].includes(status);
                if (currentFilter === 'upcoming') return ['NS', 'TBD'].includes(status);
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="status-text">No matches found for this selection.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                
                const isLive = ['1H', 'HT', '2H', 'ET', 'P'].includes(item.fixture.status.short);
                const scoreText = (item.goals.home !== null && item.goals.away !== null) 
                    ? `${item.goals.home} - ${item.goals.away}` 
                    : 'VS';

                card.innerHTML = `
                    <div class="team-info">
                        <img src="${item.teams.home.logo}" class="team-logo" alt="">
                        <span class="team-name">${item.teams.home.name}</span>
                    </div>
                    <div class="score-info">
                        <div>${scoreText}</div>
                        <span class="status-badge ${isLive ? 'live' : ''}">${item.fixture.status.elapsed ? item.fixture.status.elapsed + "'" : item.fixture.status.short}</span>
                    </div>
                    <div class="team-info away">
                        <span class="team-name">${item.teams.away.name}</span>
                        <img src="${item.teams.away.logo}" class="team-logo" alt="">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        fetchData();
    </script>
</body>
</html>
