<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALZONE — Live Football</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151d30;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8fa0bc;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .nav-links {
            margin: 15px 0 30px 0;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        .nav-links a.active {
            color: var(--accent);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #23314f;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn.active {
            background-color: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: bold;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
        }
        .date-picker {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #23314f;
            padding: 8px 15px;
            border-radius: 20px;
            outline: none;
        }
        .match-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 150px;
        }
        .status-message {
            color: var(--text-muted);
            font-size: 18px;
            padding: 20px;
        }
        .match-card {
            background: #1c263f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team { font-weight: 600; width: 40%; }
        .team.home { text-align: right; }
        .team.away { text-align: left; }
        .score {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            width: 20%;
        }
        .live-badge {
            background: #ff4a4a;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
            animation: blink 1.5s infinite;
        }
        .status-tag {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 3px;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="header">GOAL ZONE</div>
    <div class="nav-links">
        <a href="#" class="active">Live Scores</a>
        <a href="#">Fixtures</a>
        <a href="#">About</a>
    </div>

    <h2>THE FOOTBALL LIVE CENTRE</h2>
    <div class="subtitle">Live match scores, fixtures and football updates from leagues around the world.</div>

    <div class="controls">
        <button id="btn-all" class="btn active" onclick="filterMatches('all')">All</button>
        <button id="btn-live" class="btn" onclick="filterMatches('live')">🔴 Live</button>
        <button id="btn-finished" class="btn" onclick="filterMatches('finished')">Finished</button>
        <button id="btn-upcoming" class="btn" onclick="filterMatches('upcoming')">Upcoming</button>
        
        <input type="date" id="match-date" class="date-picker" onchange="onDateChange()">
        <button class="refresh-btn" onclick="fetchData()" title="Refresh">↻ Refresh</button>
    </div>

    <div class="match-container" id="match-centre">
        <div class="status-message" id="status-text">Connecting to server...</div>
        <div id="match-list"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://onrender.com';
        let currentFilter = 'all';

        // തീയതി ഇന്ത്യൻ സമയത്തിനനുസരിച്ച് (Local Time) ഇൻപുട്ടിൽ സെറ്റ് ചെയ്യാൻ
        const localDate = new Date();
        const offset = localDate.getTimezoneOffset();
        const adjustedDate = new Date(localDate.getTime() - (offset * 60 * 1000));
        document.getElementById('match-date').value = adjustedDate.toISOString().split('T')[0];

        function filterMatches(filterType) {
            currentFilter = filterType;
            const buttons = ['all', 'live', 'finished', 'upcoming'];
            buttons.forEach(b => {
                document.getElementById(`btn-${b}`).classList.toggle('active', b === filterType);
            });
            fetchData();
        }

        function onDateChange() {
            fetchData();
        }

        async function fetchData() {
            const statusText = document.getElementById('status-text');
            const matchList = document.getElementById('match-list');
            
            statusText.style.display = 'block';
            statusText.innerText = "Loading matches...";
            matchList.innerHTML = '';

            const selectedDate = document.getElementById('match-date').value;
            
            // ഫിൽട്ടർ 'live' ആണെങ്കിൽ ലൈവ് റൂട്ടും, മറ്റുള്ളവയ്ക്ക് ഡേറ്റ് അടിസ്ഥാനമാക്കിയുള്ള റൂട്ടും വിളിക്കുന്നു
            let url = `${BACKEND_URL}/api/fixtures?date=${selectedDate}`;
            if (currentFilter === 'live') {
                url = `${BACKEND_URL}/api/live`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                statusText.style.display = 'none';

                if (data.error) {
                    matchList.innerHTML = `<div class="status-message">API Error: ${JSON.stringify(data.error)}</div>`;
                    return;
                }

                if (!data.response || data.response.length === 0) {
                    matchList.innerHTML = `<div class="status-message">No matches found for this selection.</div>`;
                    return;
                }

                let filteredResponse = data.response;

                // ഫിൽട്ടർ അനുസരിച്ച് ഡാറ്റ തരംതിരിക്കുന്നു (ലൈവ് റൂട്ട് അല്ലാത്തപ്പോൾ മാത്രം)
                if (currentFilter !== 'live') {
                    if (currentFilter === 'finished') {
                        filteredResponse = data.response.filter(item => item.fixture.status.short === 'FT');
                    } else if (currentFilter === 'upcoming') {
                        filteredResponse = data.response.filter(item => item.fixture.status.short === 'NS');
                    }
                }

                if (filteredResponse.length === 0) {
                    matchList.innerHTML = `<div class="status-message">No matches match the active filter.</div>`;
                    return;
                }

                filteredResponse.forEach(item => {
                    const fixture = item.fixture;
                    const teams = item.teams;
                    const goals = item.goals;

                    const homeScore = goals.home !== null ? goals.home : '-';
                    const awayScore = goals.away !== null ? goals.away : '-';

                    let statusHTML = '';
                    // മത്സരം നടന്നുകൊണ്ടിരിക്കുകയാണെങ്കിൽ (Live) മിനിറ്റ് കാണിക്കാൻ
                    if (fixture.status.short !== 'NS' && fixture.status.short !== 'FT') {
                        statusHTML = `<div class="live-badge">${fixture.status.elapsed}'</div>`;
                    } else {
                        statusHTML = `<span class="status-tag">${fixture.status.short}</span>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="team home">${teams.home.name}</div>
                        <div class="score">
                            ${statusHTML}
                            <div>${homeScore} - ${awayScore}</div>
                        </div>
                        <div class="team away">${teams.away.name}</div>
                    `;
                    matchList.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching data:", error);
                statusText.style.display = 'block';
                statusText.innerText = "Failed to connect to server.";
            }
        }

        // പേജ് ആദ്യ തവണ ലോഡ് ആകുമ്പോൾ ഡാറ്റ കാണിക്കാൻ
        fetchData();

        // ലൈവ് ടാബിൽ ആണെങ്കിൽ ഓരോ 30 സെക്കൻഡിലും ഓട്ടോമാറ്റിക് ആയി റിഫ്രഷ് ചെയ്യും
